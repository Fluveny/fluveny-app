# CI do App: segredos, verificação (mise run check: tsc, eslint, prettier, testes, contrato da API) e
# build web, em todo PR e em todo push na main. No push na main, publica o Worker de homologação
# (web e proxy da API na mesma origem, AD-18, história 1.6).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: Segredos
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Só os commits novos; qualquer achado falha. Se o commit base não está
      # no clone (primeiro push, force push), varre o histórico inteiro e avisa.
      - name: Gitleaks nos commits novos
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
        run: |
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "::warning::Commit base $BASE fora do clone; varrendo o histórico inteiro."
            RANGE="HEAD"
          fi
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 \
            git /repo --log-opts="$RANGE" --redact --verbose --no-banner

  check:
    name: Verificação
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Node 24 e lefthook, nas versões do mise.toml.
      - uses: jdx/mise-action@v5
        with:
          version: 2026.11.8

      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json', 'tools/openapi-types/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      # A mesma tarefa que o dev roda (NFR13): npm ci, gerador de tipos da API,
      # tipos das rotas, tsc, eslint, prettier --check, jest, contrato da API
      # (api:check: cópia = arquivo da API no sha do lock, sha na main, tipos)
      # build web e orçamento da primeira tela (bundle:budget, 500 KB com gzip). Os passos ficam no mise.toml.
      - name: mise run check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: 'true'
        run: mise run check

  # Worker de homologação (AD-18, história 1.6): o build web e o proxy de /api/* na mesma origem.
  # Segredos e variáveis no GitHub Environment `homolog` (veja o README). Sem o token da
  # Cloudflare, avisa e não falha.
  deploy-homolog:
    name: Deploy em homologação
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [secrets, check]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: homolog
    concurrency:
      group: deploy-homolog
      cancel-in-progress: false
    env:
      WRANGLER: wrangler@4.164.0
    steps:
      - name: Token da Cloudflare
        id: token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::Sem o secret CLOUDFLARE_API_TOKEN no Environment homolog; o Worker não foi publicado."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configuração do Environment
        if: steps.token.outputs.skip != 'true'
        env:
          FLUVENY_PROXY_SECRET: ${{ secrets.FLUVENY_PROXY_SECRET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          FLUVENY_WEB_ORIGIN: ${{ vars.FLUVENY_WEB_ORIGIN }}
        run: |
          missing=""
          [ -n "$FLUVENY_PROXY_SECRET" ] || missing="$missing secret FLUVENY_PROXY_SECRET"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing variável CLOUDFLARE_ACCOUNT_ID"
          [ -n "$FLUVENY_WEB_ORIGIN" ] || missing="$missing variável FLUVENY_WEB_ORIGIN"
          if [ -n "$missing" ]; then
            echo "::error::Faltam no Environment homolog:$missing"
            exit 1
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.skip != 'true'

      - uses: jdx/mise-action@v5
        if: steps.token.outputs.skip != 'true'
        with:
          version: 2026.11.8

      - uses: actions/cache@v4
        if: steps.token.outputs.skip != 'true'
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json', 'tools/openapi-types/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      # O App web chama a API pela origem do Worker (EXPO_PUBLIC_API_URL = essa origem).
      - name: Build web
        if: steps.token.outputs.skip != 'true'
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.FLUVENY_WEB_ORIGIN }}
          EXPO_PUBLIC_SENTRY_ENVIRONMENT: homolog
        run: |
          npm ci
          npx expo export -p web

      # O segredo sobe junto com o código, na mesma versão (`deploy --secrets-file`): nem o
      # primeiro deploy fica com /api/* em 503, nem uma versão nova vai ao ar com o segredo
      # antigo. O arquivo é JSON (sem a expansão de $VAR do dotenv), com modo 600 no
      # RUNNER_TEMP, e é apagado no fim do passo, com ou sem falha.
      - name: Publicar o Worker
        if: steps.token.outputs.skip != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          FLUVENY_PROXY_SECRET: ${{ secrets.FLUVENY_PROXY_SECRET }}
        run: |
          secrets_file="$RUNNER_TEMP/worker-secrets.json"
          trap 'rm -f "$secrets_file"' EXIT
          node -e 'require("node:fs").writeFileSync(process.argv[1], JSON.stringify({ PROXY_SECRET: process.env.FLUVENY_PROXY_SECRET }), { mode: 0o600 })' "$secrets_file"
          npx --yes "$WRANGLER" deploy --secrets-file "$secrets_file"

      # Confere o deploy: a página e a API pela mesma origem. O retry cobre a partida a frio do
      # Render (~140 s).
      - name: Conferir o deploy
        if: steps.token.outputs.skip != 'true'
        env:
          ORIGIN: ${{ vars.FLUVENY_WEB_ORIGIN }}
        run: |
          page="$(curl -s -o /dev/null -w '%{http_code}' --max-time 180 --retry 2 --retry-all-errors "$ORIGIN/" || true)"
          if [ "$page" != "200" ]; then
            echo "::error::$ORIGIN/ respondeu $page (esperado 200)."
            exit 1
          fi
          api="$(curl -s -o /dev/null -w '%{http_code} %{content_type}' --max-time 180 --retry 2 --retry-all-errors "$ORIGIN/api/v1/units" || true)"
          case "$api" in
            "200 application/json"*) echo "Deploy conferido: página 200 e /api/v1/units $api." ;;
            *)
              echo "::error::$ORIGIN/api/v1/units respondeu '$api' (esperado 200 com JSON)."
              exit 1
              ;;
          esac
